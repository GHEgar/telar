name: release

on:
    push:
        tags: ['*-v*']
    workflow_dispatch:
        inputs:
            tag:
                description: Tag to publish, for example grana-v0.3.0
                required: true

permissions:
    contents: write
    id-token: write
    packages: write

env:
    TAG: ${{ inputs.tag || github.ref_name }}

jobs:
    npm:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.TAG }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org
            - run: npm install -g npm@^11.5.1
            - name: Piece and version from the tag
              run: |
                  piece="${TAG%-v*}"
                  version="${TAG##*-v}"
                  test -f "packages/$piece/package.json" || { echo "no piece packages/$piece" >&2; exit 1; }
                  {
                      echo "PIECE=$piece"
                      echo "VERSION=$version"
                      echo "NAME=$(node -p "require('./packages/$piece/package.json').name")"
                  } >> "$GITHUB_ENV"
            - name: Tag and package.json agree
              run: test "$(node -p "require('./packages/$PIECE/package.json').version")" = "$VERSION"
            - run: npm ci
            - run: npm test
            - run: npm run build
            - name: Release notes from the changelog
              run: awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on' "packages/$PIECE/docs/CHANGELOG.md" > notes.md
            - name: GitHub release
              run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$PIECE $VERSION" --notes-file notes.md --verify-tag
              env:
                  GH_TOKEN: ${{ github.token }}
            - name: npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm view "$NAME@$VERSION" version > /dev/null 2>&1 || npm publish --workspace "packages/$PIECE" --provenance --access public

    github-packages:
        needs: npm
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.TAG }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://npm.pkg.github.com
                  scope: '@ghegar'
            - name: Piece and version from the tag
              run: |
                  {
                      echo "PIECE=${TAG%-v*}"
                      echo "VERSION=${TAG##*-v}"
                  } >> "$GITHUB_ENV"
            - run: npm ci
            - run: npm run build
            - run: npm pkg set "name=@ghegar/$PIECE" --workspace "packages/$PIECE"
            - name: GitHub Packages
              run: npm view "@ghegar/$PIECE@$VERSION" version > /dev/null 2>&1 || npm publish --workspace "packages/$PIECE"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
